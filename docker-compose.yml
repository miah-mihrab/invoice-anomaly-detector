services:

  ml:
    build:
      context: .

    container_name: invoice-anomaly-detector

    volumes:
      - .:/app

    environment:
      PYTHONUNBUFFERED: "1"
      PG_HOST: ${PG_HOST}
      PG_PORT: 5432
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASS: ${PG_PASS}
    
    ports:
      - "8888:8888"
      - "8000:8000"

    command: uvicorn src.ml_service.main:app --host 0.0.0.0 --port 8000 --reload

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18

    container_name: invoice-anomaly-postgres

    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_HOST: ${PG_HOST}
      POSTGRES_PORT: 5432

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d anomaly_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api

    container_name: invoice-anomaly-api

    volumes:
      - ./api:/app
      - /app/node_modules

    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASS: ${PG_PASS}
      ML_SERVICE_URL: http://ml:8000
      PORT: 3000

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_started

volumes:
  postgres_data: